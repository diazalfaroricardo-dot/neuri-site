name: Secretos
# hf-idea-20261121-secretos-dependencias: Gitleaks en cada push y PR, en ubuntu-latest.
# Corren los dos escáneres: el nuestro (scripts/secret-scan.mjs) y Gitleaks (.gitleaks.toml).
# Solo revisa los commits nuevos del push o del PR. Historial completo: workflow_dispatch.
# Mismo flujo que neuri-bazar (mantener iguales).
on:
  push:
    branches-ignore: ["dependabot/**"] # esos ya se revisan en su PR
  pull_request:
  workflow_dispatch:
    inputs:
      historial:
        description: "Revisar todo el historial (no solo el último commit)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Escaneo propio (llaves de Neuri)
        run: node scripts/secret-scan.mjs
      - name: Pruebas de la fusión de Dependabot
        run: node --test scripts/dependabot-automerge.test.mjs
      - name: Instalar Gitleaks (binario fijado por SHA-256)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz && ./gitleaks version
      - name: Gitleaks
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
          HISTORIAL: ${{ inputs.historial }}
        run: |
          rango=""
          case "$EVENTO" in
            pull_request) rango="$BASE..$CABEZA" ;;
            push)
              if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES" 2>/dev/null; then
                rango="$ANTES..$DESPUES"
              else
                rango="-1 $DESPUES"
              fi ;;
            workflow_dispatch) [ "$HISTORIAL" = "true" ] || rango="-1 $DESPUES" ;;
          esac
          echo "Rango: ${rango:-todo el historial}"
          extra=()
          [ -n "$rango" ] && extra=(--log-opts "$rango")
          # --redact: el valor nunca aparece en el log; solo archivo, línea, commit y regla.
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks.json "${extra[@]}"
      - if: failure()
        name: Resumen (sin valores)
        run: |
          [ -f gitleaks.json ] || exit 0
          {
            echo "### Gitleaks encontró posibles secretos"
            echo "Rota la llave si es real y quítala del código. El valor no se muestra."
            echo
            echo "| Regla | Archivo | Línea | Commit |"
            echo "|---|---|---|---|"
            node -e 'for (const f of require("./gitleaks.json")) console.log(`| ${f.RuleID} | ${f.File} | ${f.StartLine} | ${f.Commit.slice(0, 8)} |`)'
          } >> "$GITHUB_STEP_SUMMARY"
