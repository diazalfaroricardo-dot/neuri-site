<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuri — Laboratorio de productos de inteligencia artificial</title>
<meta name="description" content="Neuri diseña agentes de IA que hacen el trabajo repetitivo de los negocios: contestar compradores, cobrar, apartar y cuadrar la caja. Productos: neuri.bots y neuri.bazar.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 30 30%22%3E%3Crect width=%2230%22 height=%2230%22 rx=%228%22 fill=%22%2304060A%22/%3E%3Ccircle cx=%2215%22 cy=%2215%22 r=%225%22 fill=%22%238FE0B4%22/%3E%3Ccircle cx=%2223%22 cy=%229%22 r=%222%22 fill=%22%23E9EEF2%22/%3E%3C/svg%3E">
<link rel="alternate" hreflang="es" href="https://neuri.tech/">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:#04060A}
body{overflow-x:hidden}
#dc-a{overflow-x:clip}
:focus-visible{outline:2px solid #8FE0B4;outline-offset:3px}
#dc-a a,#dc-a button{min-height:44px}

body{margin:0;background:#04060A}
a{color:#E9EEF2}a:hover{color:#8FE0B4}
::selection{background:#8FE0B4;color:#04060A}
.x-mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
@keyframes xDrift{0%{background-position:0 0,0 0,0 0}100%{background-position:0 -600px,0 -400px,0 -260px}}
.x-stars{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.75;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 80px,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 90px 160px,rgba(143,224,180,.8),transparent);
  background-size:220px 220px,300px 300px,420px 420px;animation:xDrift 90s linear infinite}
.x-aurora{position:absolute;z-index:0;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.55}
@keyframes xFloatA{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,40px)}}
@keyframes xFloatB{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-50px)}}
.x-aur-a{animation:xFloatA 18s ease-in-out infinite}
.x-aur-b{animation:xFloatB 22s ease-in-out infinite}
.x-grid{position:absolute;left:-20%;right:-20%;bottom:-2px;height:46%;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(143,224,180,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(143,224,180,.22) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(520px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:xGrid 6s linear infinite}
@keyframes xGrid{0%{background-position:0 0}100%{background-position:0 64px}}
@keyframes xSpin{to{transform:rotate(360deg)}}
@keyframes xSpinR{to{transform:rotate(-360deg)}}
.x-spin{transform-origin:210px 210px;animation:xSpin 28s linear infinite}
.x-spin-r{transform-origin:210px 210px;animation:xSpinR 40s linear infinite}
.x-spin-f{transform-origin:210px 210px;animation:xSpin 12s linear infinite}
@keyframes xPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.x-core{transform-origin:210px 210px;animation:xPulse 3.2s ease-in-out infinite}
@keyframes xDash{to{stroke-dashoffset:-200}}
.x-synapse{stroke-dasharray:6 14;animation:xDash 3s linear infinite}
@keyframes xBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.x-caret{animation:xBlink 1s step-end infinite}
@keyframes xLive{0%{box-shadow:0 0 0 0 rgba(143,224,180,.6)}100%{box-shadow:0 0 0 9px rgba(143,224,180,0)}}
.x-live{width:8px;height:8px;border-radius:50%;background:#8FE0B4;animation:xLive 1.6s infinite;flex-shrink:0}
@keyframes xWordA{0%{opacity:0;transform:translateY(.4em);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes xWordB{0%{opacity:0;transform:translateY(.4em);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.x-wa{display:inline-block;animation:xWordA .6s cubic-bezier(.2,.8,.2,1) both}
.x-wb{display:inline-block;animation:xWordB .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes xLine{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:none}}
.x-line{animation:xLine .35s ease both}
@keyframes xRise{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:none}}
.x-rise{animation:xRise .9s cubic-bezier(.2,.8,.2,1) both}
.x-r2{animation-delay:.12s}.x-r3{animation-delay:.24s}.x-r4{animation-delay:.36s}
@keyframes xScan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.x-scan{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(to bottom,transparent,rgba(143,224,180,.08) 48%,rgba(143,224,180,.25) 50%,transparent 52%);animation:xScan 4.5s linear infinite;pointer-events:none}
.x-card{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}
.x-card:hover{transform:translateY(-6px);border-color:rgba(143,224,180,.55)!important}
.x-btn{transition:transform .2s,box-shadow .2s,background .2s}
.x-btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #8FE0B4,0 12px 40px -8px rgba(143,224,180,.55)}
.x-cmd{transition:background .2s,border-color .2s}
.x-cmd:hover{background:rgba(255,255,255,.06)!important}
.x-word{opacity:1}
@supports (animation-timeline: view()){
  @keyframes xLit{0%{opacity:.14}100%{opacity:1}}
  .x-word{animation:xLit linear both;animation-timeline:view()}
}
@keyframes xMarq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.x-marq{display:flex;gap:56px;width:max-content;animation:xMarq 38s linear infinite}
.x-marq-wrap{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
@media (max-width:900px){.x-hide-sm{display:none !important}}
@media (prefers-reduced-motion:reduce){.x-stars,.x-aur-a,.x-aur-b,.x-grid,.x-spin,.x-spin-r,.x-spin-f,.x-core,.x-synapse,.x-caret,.x-live,.x-wa,.x-wb,.x-line,.x-rise,.x-scan,.x-marq{animation:none !important}.x-word{animation:none !important;opacity:1}}

</style>
</head>
<body>
<div id="dc-a"></div>
<template data-dc-part="dc-a">
<div style="background: #04060A; color: #E9EEF2; font-family: 'Geist', system-ui, sans-serif; min-height: 100%; overflow: hidden">

<header style="position: relative; z-index: 5; max-width: 1280px; margin: 0 auto; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
<a href="#inicio" aria-label="Neuri, inicio" style="text-decoration: none; display: inline-flex; align-items: center; gap: 12px; min-height: 44px">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="none" stroke="#8FE0B4" stroke-width="1.5" opacity=".5"></circle><circle cx="15" cy="15" r="5" fill="#8FE0B4"></circle><circle cx="26" cy="9" r="2" fill="#E9EEF2"></circle></svg>
<span style="font-weight: 700; font-size: 22px; letter-spacing: -0.04em">neuri</span>
</a>
<nav aria-label="Principal" style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
<a class="x-hide-sm x-mono" href="#sistemas" style="text-decoration: none; font-size: 12.5px; color: #9AA6B2; min-height: 44px; display: inline-flex; align-items: center">Sistemas</a>
<a class="x-hide-sm x-mono" href="#consola" style="text-decoration: none; font-size: 12.5px; color: #9AA6B2; min-height: 44px; display: inline-flex; align-items: center">Consola</a>
<a class="x-hide-sm x-mono" href="#principios" style="text-decoration: none; font-size: 12.5px; color: #9AA6B2; min-height: 44px; display: inline-flex; align-items: center">Principios</a>
<a class="x-hide-sm x-mono" href="#laboratorio" style="text-decoration: none; font-size: 12.5px; color: #9AA6B2; min-height: 44px; display: inline-flex; align-items: center">Laboratorio</a>
<a class="x-btn" href="mailto:hola@neuri.tech" style="text-decoration: none; font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 999px; border: 1px solid rgba(233,238,242,.25); min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Hablar con Neuri</a>
</nav>
</header>

<section id="inicio" aria-labelledby="x-h1" style="position: relative; padding: 40px 28px 150px">
<div class="x-stars" aria-hidden="true"></div>
<div class="x-aurora x-aur-a" aria-hidden="true" style="width: 620px; height: 620px; top: -140px; right: -120px; background: radial-gradient(closest-side, rgba(143,224,180,.55), rgba(56,189,248,.18), transparent)"></div>
<div class="x-aurora x-aur-b" aria-hidden="true" style="width: 520px; height: 520px; top: 260px; left: -220px; background: radial-gradient(closest-side, rgba(129,104,255,.45), transparent)"></div>
<div class="x-grid" aria-hidden="true"></div>
<div style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<span class="x-mono x-rise" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: #8FE0B4; border: 1px solid rgba(143,224,180,.35); background: rgba(143,224,180,.06); padding: 8px 14px; border-radius: 999px"><span class="x-live"></span>Laboratorio de productos de IA · Phoenix → Sinaloa</span>
<h1 id="x-h1" class="x-rise x-r2" style="margin: 0; font-weight: 700; font-size: clamp(52px, 8vw, 112px); line-height: 0.92; letter-spacing: -0.06em">Software que <span class="{{wordCls}}" style="background: linear-gradient(92deg, #8FE0B4, #67E8F9 55%, #A78BFA); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em">{{word}}</span><br>mientras tú vives.</h1>
<p class="x-rise x-r3" style="margin: 0; font-size: 21px; line-height: 1.5; color: #B7C2CC; max-width: 34em; font-weight: 300">Neuri diseña agentes de inteligencia artificial que hacen el trabajo repetitivo de los negocios reales: contestar, cobrar, apartar, cuadrar la caja. Tú decides. Ellos ejecutan.</p>
<div class="x-rise x-r4" style="display: flex; gap: 12px; flex-wrap: wrap">
<a class="x-btn" href="#sistemas" style="text-decoration: none; background: #E9EEF2; color: #04060A; font-weight: 600; font-size: 16px; padding: 16px 24px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px">Ver sistemas en operación<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a class="x-btn" href="#consola" style="text-decoration: none; color: #E9EEF2; font-weight: 600; font-size: 16px; padding: 16px 24px; border-radius: 999px; border: 1px solid rgba(233,238,242,.25); min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px"><span class="x-mono" style="font-size: 12px; border: 1px solid rgba(233,238,242,.3); border-radius: 6px; padding: 2px 6px">⌘K</span>Abrir la consola</a>
</div>
</div>

<div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center; position: relative">
<div style="position: relative; width: 420px; max-width: 100%; aspect-ratio: 1">
<svg viewBox="0 0 420 420" width="100%" height="100%" role="img" aria-label="Núcleo de Neuri: anillos de agentes girando alrededor de un centro brillante">
<defs>
<radialGradient id="xg-core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E9FFF4"></stop><stop offset="35%" stop-color="#8FE0B4"></stop><stop offset="100%" stop-color="#8FE0B4" stop-opacity="0"></stop></radialGradient>
<linearGradient id="xg-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8FE0B4"></stop><stop offset="100%" stop-color="#A78BFA" stop-opacity=".3"></stop></linearGradient>
</defs>
<circle cx="210" cy="210" r="200" fill="none" stroke="rgba(233,238,242,.08)"></circle>
<g class="x-spin-r"><circle cx="210" cy="210" r="182" fill="none" stroke="url(#xg-ring)" stroke-width="1" stroke-dasharray="2 10"></circle><circle cx="392" cy="210" r="5" fill="#A78BFA"></circle><circle cx="28" cy="210" r="3" fill="#E9EEF2"></circle></g>
<g class="x-spin"><circle cx="210" cy="210" r="140" fill="none" stroke="rgba(143,224,180,.45)" stroke-width="1"></circle><circle cx="210" cy="70" r="6" fill="#8FE0B4"></circle><circle cx="350" cy="210" r="3.5" fill="#67E8F9"></circle><circle cx="111" cy="309" r="4" fill="#E9EEF2"></circle></g>
<g class="x-spin-f"><circle cx="210" cy="210" r="96" fill="none" stroke="rgba(103,232,249,.35)" stroke-width="1" stroke-dasharray="40 18"></circle><circle cx="306" cy="210" r="3" fill="#67E8F9"></circle></g>
<path class="x-synapse" d="M210 210 L210 70 M210 210 L350 210 M210 210 L111 309 M210 210 L392 210" stroke="rgba(143,224,180,.5)" stroke-width="1" fill="none"></path>
<circle class="x-core" cx="210" cy="210" r="64" fill="url(#xg-core)"></circle>
<circle cx="210" cy="210" r="14" fill="#04060A" stroke="#E9FFF4" stroke-width="2"></circle>
</svg>
<div class="x-mono" style="position: absolute; top: 6%; left: -6%; font-size: 11px; color: #9AA6B2; background: rgba(4,6,10,.75); border: 1px solid rgba(233,238,242,.12); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 4px">
<span style="color: #8FE0B4">● Agente · mensajes</span><span style="color: #E9EEF2; font-size: 13px; letter-spacing: .02em; text-transform: none">Responde en segundos</span>
</div>
<div class="x-mono" style="position: absolute; bottom: 10%; right: -6%; font-size: 11px; color: #9AA6B2; background: rgba(4,6,10,.75); border: 1px solid rgba(233,238,242,.12); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 4px">
<span style="color: #A78BFA">● Agente · caja</span><span style="color: #E9EEF2; font-size: 13px; letter-spacing: .02em; text-transform: none">Cuadra el día solo</span>
</div>
<div class="x-mono" style="position: absolute; bottom: -2%; left: 4%; font-size: 11px; color: #9AA6B2">PHX {{clock}} · Sistema en línea</div>
</div>
</div>
</div>
</section>

<section aria-label="Lo que hacen los agentes" style="position: relative; z-index: 2; border-top: 1px solid rgba(233,238,242,.08); border-bottom: 1px solid rgba(233,238,242,.08); padding: 22px 0; background: #070A10">
<div class="x-marq-wrap"><div class="x-marq x-mono" style="font-size: 13px; color: #6E7A86">
<template sc-for list="{{marquee}}" as="m" hint-placeholder-count="10"><span style="display: inline-flex; align-items: center; gap: 14px; white-space: nowrap"><span style="color: #8FE0B4">◆</span>{{m.t}}</span></template>
</div></div>
</section>

<section aria-label="Manifiesto" style="max-width: 1120px; margin: 0 auto; padding: 150px 28px">
<p class="x-mono" style="margin: 0 0 28px; font-size: 12px; color: #8FE0B4">01 · Manifiesto</p>
<p style="margin: 0; font-size: clamp(32px, 4.6vw, 60px); line-height: 1.12; letter-spacing: -0.035em; font-weight: 500">
<template sc-for list="{{manifesto}}" as="w" hint-placeholder-count="30"><span class="x-word" style="{{w.style}}">{{w.t}} </span></template>
</p>
</section>

<section id="sistemas" aria-labelledby="x-sis" style="max-width: 1280px; margin: 0 auto; padding: 40px 28px 140px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 44px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px">
<p class="x-mono" style="margin: 0; font-size: 12px; color: #8FE0B4">02 · Sistemas en operación</p>
<h2 id="x-sis" style="margin: 0; font-size: clamp(38px, 5vw, 68px); line-height: 0.98; letter-spacing: -0.05em; font-weight: 700">Dos misiones. Ya en órbita.</h2>
</div>
<p style="margin: 0; color: #9AA6B2; font-size: 17px; max-width: 26em; line-height: 1.5">Cada producto es un agente especializado en un trabajo que antes te robaba horas.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px">
<template sc-for list="{{missions}}" as="ms" hint-placeholder-count="2">
<a class="x-card" href="{{ms.href}}" style="text-decoration: none; color: #E9EEF2; position: relative; overflow: hidden; border: 1px solid rgba(233,238,242,.12); border-radius: 28px; padding: 32px; background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); display: flex; flex-direction: column; gap: 22px; min-height: 420px">
<div class="x-scan" aria-hidden="true"></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; position: relative">
<span class="x-mono" style="font-size: 12px; color: #9AA6B2">{{ms.code}}</span>
<span class="x-mono" style="display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: {{ms.color}}; border: 1px solid {{ms.border}}; padding: 6px 10px; border-radius: 999px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{ms.color}}"></span>{{ms.status}}</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: clamp(34px, 3.6vw, 48px); letter-spacing: -0.045em; font-weight: 700; line-height: 1">{{ms.name}}</h3>
<p style="margin: 0; font-size: 18px; color: #B7C2CC; line-height: 1.5; font-weight: 300">{{ms.desc}}</p>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: auto">
<template sc-for list="{{ms.stats}}" as="s" hint-placeholder-count="3">
<div style="border: 1px solid rgba(233,238,242,.1); border-radius: 16px; padding: 14px; background: rgba(4,6,10,.5); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 22px; font-weight: 600; letter-spacing: -0.03em; color: {{ms.color}}">{{s.v}}</span>
<span class="x-mono" style="font-size: 10.5px; color: #7D8994; line-height: 1.4">{{s.k}}</span>
</div>
</template>
</div>
<span style="position: relative; display: inline-flex; align-items: center; gap: 10px; font-weight: 600">{{ms.cta}}<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"></path></svg></span>
</a>
</template>
</div>
</section>

<section id="consola" aria-labelledby="x-con" style="position: relative; padding: 140px 28px; background: radial-gradient(900px 500px at 50% 0%, rgba(103,232,249,.10), transparent), #05080D; border-top: 1px solid rgba(233,238,242,.08)">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
<p class="x-mono" style="margin: 0; font-size: 12px; color: #8FE0B4">03 · Consola</p>
<h2 id="x-con" style="margin: 0; font-size: clamp(38px, 5vw, 68px); line-height: 0.98; letter-spacing: -0.05em; font-weight: 700">Una orden. El agente hace el resto.</h2>
<p style="margin: 0; font-size: 19px; color: #9AA6B2; line-height: 1.5; font-weight: 300">Elige una orden y mira lo que pasa por dentro. Es una simulación con datos de ejemplo de lo que ya hacen nuestros productos.</p>
</div>
<div style="border: 1px solid rgba(233,238,242,.14); border-radius: 24px; background: rgba(10,14,20,.85); box-shadow: 0 40px 120px -40px rgba(103,232,249,.25); overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(233,238,242,.08)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6B2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex: 1; font-size: 17px; color: #E9EEF2">{{query}}<span class="x-caret" style="color: #8FE0B4">▍</span></span>
<span class="x-mono x-hide-sm" style="font-size: 11px; color: #6E7A86; border: 1px solid rgba(233,238,242,.15); border-radius: 6px; padding: 3px 7px">⌘K</span>
</div>
<div style="display: flex; flex-wrap: wrap">
<div role="listbox" aria-label="Órdenes" style="flex: 1 1 340px; min-width: 0; padding: 10px; border-right: 1px solid rgba(233,238,242,.08); display: flex; flex-direction: column; gap: 4px">
